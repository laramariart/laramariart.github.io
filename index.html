    <div id="sb-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background-color:#000000; z-index:99999999; align-items:center; justify-content:center; -webkit-user-select:none; user-select:none;">
  <span id="sb-close" style="position:absolute; top:20px; right:25px; color:#ffffff; font-size:40px; font-weight:bold; cursor:pointer; z-index:100000000; line-height:1; font-family:sans-serif;">&times;</span>
  <img id="sb-img" src="" alt="Enlarged view" style="max-width:92vw; max-height:92vh; object-fit:contain; border-radius:4px; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;" oncontextmenu="return false;">
</div>

<style>
  /* Force images and containers to remain clickable despite theme overlays */
  .article-container, .article-container *, .load.image, .load.image img {
    pointer-events: auto !important;
    cursor: pointer !important;
  }
</style>

<script>
(function() {
  var modal = document.getElementById('sb-modal');
  var modalImg = document.getElementById('sb-img');

  function openBox(src) {
    if (!src) return;
    modalImg.src = src;
    modal.style.display = 'flex';
  }

  function closeBox() {
    modal.style.display = 'none';
    modalImg.src = '';
  }

  // Variables to track touch movement for scroll detection
  var touchStartX = 0;
  var touchStartY = 0;
  var isSwipingOrScrolling = false;

  // 1. Capture touch start coordinates
  window.addEventListener('touchstart', function(e) {
    if (e.touches && e.touches.length > 0) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      isSwipingOrScrolling = false;
    }
  }, { capture: true, passive: true });

  // 2. Mark as scrolling if finger moves more than 10 pixels
  window.addEventListener('touchmove', function(e) {
    if (e.touches && e.touches.length > 0) {
      var moveX = Math.abs(e.touches[0].clientX - touchStartX);
      var moveY = Math.abs(e.touches[0].clientY - touchStartY);

      if (moveX > 10 || moveY > 10) {
        isSwipingOrScrolling = true; // User is scrolling, not tapping!
      }
    }
  }, { capture: true, passive: true });

  // 3. Helper to process image tap
  function handleImageTap(e) {
    // IGNORE if the user was dragging/scrolling
    if (isSwipingOrScrolling) return;

    var target = e.target;
    
    if (target && target.tagName !== 'IMG') {
      target = target.querySelector('img');
    }

    if (target && target.tagName === 'IMG' && target.id !== 'sb-img') {
      var parent = target.parentElement;
      while (parent) {
        if (parent.classList && parent.classList.contains('article-container')) {
          e.preventDefault();
          e.stopPropagation();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          openBox(target.src);
          return false;
        }
        parent = parent.parentElement;
      }
    }
  }

  // Handle tap on end of touch or click
  window.addEventListener('touchend', handleImageTap, true);
  window.addEventListener('click', handleImageTap, true);

  // Close shadowbox when tapping background or close button
  modal.addEventListener('click', closeBox, false);
  modal.addEventListener('touchend', function(e) {
    if (!isSwipingOrScrolling) closeBox();
  }, false);

  // Disable right-click / context menu
  modal.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
  });
})();
</script>
